        value: "ρ = 0,37"
        ci: "[−0,01; 0,70]"
        n: "89 / 8"
        plain: "Besser als Phase 2 (−0,04), und das Modell überträgt sich jetzt zwischen den beiden US-Standorten."
      - label: "Runde 2 – einfacher"
        value: "ρ = −0,01"
        ci: "[−0,21; 0,59]"
