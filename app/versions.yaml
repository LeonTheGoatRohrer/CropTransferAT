  - id: nachtlauf-extras
    date: 2026-10-16
    phase: "Zusatzanalysen (Phase 2.4 / 3.4a)"
    title: "Zusatzanalysen aus dem Nachtlauf"
    status: zwischenstand
    changed: "Drei Nebenfragen geklärt: Zeitachse, absoluter Ertrag, Afrika-Felder (nur Tabelle)."
    plain: >
      Neben den Hauptphasen wurden drei Fragen geprüft. Erstens: Ist es besser, die Saison nach Kalendertagen
      oder nach Wärmesumme (Grad-Tagen) zu rechnen? Zweitens: Wie gut lässt sich der Ertrag in Tonnen je Hektar
      (nicht nur relativ zum Normaljahr) vorhersagen? Drittens: Was erklärt bei den 10.204 Feldern aus Afrika
      (One Acre Fund) die Ertragsunterschiede – ohne Satellitenbilder, nur aus der Tabelle?
    metrics:
      - label: "Absoluter Ertrag aus Satellit (t/ha)"
        value: "ρ = 0,52"
        ci: "[0,22; 0,76]"
        n: "167 Feld-Jahre / 15 Standort-Jahre"
        plain: "Welche Felder viel und welche wenig tragen, sieht der Satellit recht gut. Der Boden allein (ρ ≤ 0,16) erklärt fast nichts."
      - label: "Kalender vs. Wärmesumme"
        value: "kein Unterschied"
        plain: "Beide Zeitachsen liefern ähnliche Ergebnisse; alle Vertrauensbereiche schließen 0 ein."
      - label: "Afrika: Bewirtschaftung erklärt Ertrag"
        value: "R² ≈ 0,05–0,07"
        n: "10 204 Felder"
        plain: "Düngung, Aussaat usw. erklären nur 5–7 % der Unterschiede. Gemeldete Schäden (Hagel, Nässe) zeigen keinen klaren Effekt."
    found:
      - "Der Satellit sieht das Ertragsniveau eines Feldes (hoch/niedrig), aber nicht, ob dieses Jahr besser oder schlechter als sonst ist."
      - "Die Afrika-Daten sind für Österreich nicht übertragbar (andere Anbauweise, Koordinaten nur grob)."
    limits:
      - "Die One-Acre-Fund-Felder wurden ohne Satellitenbilder ausgewertet, weil die Koordinaten auf etwa 100 m gerundet sind und die Feldgröße fehlt."
    figures:
      - file: phase2_oaf_damage.png
        caption: "One Acre Fund: gemeldete Schäden je Land und Jahr."
      - file: phase2_oaf_groups.png
        caption: "One Acre Fund: Merkmalsgruppen und ihr Erklärungswert."
      - file: phase2_oaf_shap.png
        caption: "One Acre Fund: wichtigste Merkmale (SHAP)."
    links:
