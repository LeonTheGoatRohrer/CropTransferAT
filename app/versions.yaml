      - "In Kayad schwankt der relative Ertrag viel weniger als bei BARC (SD 0,10–0,15 gegenüber 0,26)."
      - "Bei Colorado sind 4 von 10 Teilflächen-Jahren fast Totalausfälle; sie werden getrennt berichtet."
    limits:
