        value: "ρ = 0,43"
        ci: "[0,24; 0,72]"
        plain: "Je höher der Stress-Score, desto niedriger der Ertrag. Der Zusammenhang ist statistisch sicher."
      - label: "Gelerntes Modell (Schwelle auf Vorhersage)"
        value: "PR-AUC 0,40"
        ci: "[0,32; 0,82]"
        plain: "Das aufwendigere gelernte Modell ist kaum besser als Raten."
      - label: "Urteil Phase 4"
        value: "nicht stark genug"
        plain: "Keine der 64 geprüften Modellvarianten erfüllt das vorab festgelegte Kriterium."
