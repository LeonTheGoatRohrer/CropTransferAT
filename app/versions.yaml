# Versionsregister der Website (app/streamlit_app.py, Seite "Ergebnisse").
# Eine Version = ein abgeschlossener Schritt mit eigenem Ergebnis. Jede Zahl hier steht auch in
# reports/results.md bzw. den results/-Ordnern (AGENTS.md §6). Reihenfolge: neueste zuerst.
#
# Felder je Version:
#   id        eindeutig (Git-Tag oder Kurzname)
#   date      Datum des Abschlusses
#   phase     Phase laut PLAN.md
#   title     kurzer Titel
#   status    abgeschlossen | eingeschraenkt | nicht_bestanden | eingefroren | zwischenstand
#   changed   EIN Satz: Was wurde in dieser Version geändert? (steht groß über der Karte)
#   plain     2–4 Sätze in einfacher Sprache
#   metrics   Kennzahlen: label, value, ci (optional), n (optional), plain (= was die Zahl heißt)
#   found     Befunde in einfacher Sprache
#   limits    Grenzen / Einschränkungen
#   figures   Dateinamen unter reports/figures/ mit Bildunterschrift
#   links     Pfade im Repository (Datenkritik, Ergebnisse, Protokolle)

versions:
  - id: freeze-at-3
    date: 2026-10-28
    phase: "Österreich-Test III: Steiermark mit Hatzendorf-Excel-Reihen (explorativ, Tag freeze-at-3)"
    title: "Steiermark-Test mit den langen Versuchsreihen vorab festgeschrieben"
    status: eingefroren
    changed: "Die Versuchsstation Hatzendorf hat die langen Ertragsreihen von Wagna und Kalsdorf geschickt; ein dritter Österreich-Test mit 2026 wurde vor jeder Berechnung festgeschrieben."
    plain: >
      Für die Steiermark gibt es jetzt durchgehende Ertragsreihen bis 2026 direkt von der Versuchsstation. Damit könnten erstmals 15 Standort-Jahre zusammenkommen,
      die Mindestzahl für einen echten Test. Wir haben vorher festgelegt, wie gerechnet wird. Ehrlich dazugesagt: 13 dieser 15 Punkte kannten wir schon,
      wirklich neu und blind sind nur die zwei Jahre 2026. Ein Ergebnis gibt es noch nicht.
    metrics:
      - label: "Erwartete Standort-Jahre"
        value: "15"
        n: "Wagna 9, Kalsdorf 6 (2018–2026)"
        plain: "Genau an der vorab verlangten Schwelle; fehlt ein 2026-Wert, ist der Test nicht auswertbar."
      - label: "Davon blind (Scores noch nicht berechnet)"
        value: "2"
        n: "Wagna 2026, Kalsdorf 2026"
        plain: "Nur diese beiden Punkte sind ein echter Test ohne Vorwissen."
    found:
      - "Die Excel-Werte stimmen mit den früher aus den Versuchsberichten abgeschriebenen Werten fast genau überein (Abweichung höchstens 0,6 %)."
      - "Wagna liegt ab 2021 deutlich tiefer, auch ohne Düngung; 2025 und 2026 sind Extremjahre (2,4 und 3,3 t/ha)."
    limits:
      - "Der Score beschreibt die Maisfelder im Umkreis von 5 km, nicht die kleine Versuchsfläche."
      - "13 von 15 Standort-Jahren waren vor dem Festschreiben bekannt; das Ergebnis ist eine Neubewertung, kein unabhängiger Beweis."
      - "Ursache des Strukturbruchs in Wagna und der Extremjahre ist offen (Rückfrage an die Station)."
    links:
      - label: "Freeze-Protokoll"
        path: reports/freeze_protocol_at3.md
      - label: "Datenkritik Erträge"
        path: reports/data_review/at_test3_ertraege.md
  - id: at-test-2
    date: 2026-10-17
    phase: "Österreich-Test II: Steiermark (explorativ, Tag freeze-at-2)"
    title: "Steiermark: zu wenige Daten für einen Test, Richtung wie in Oberösterreich"
    status: eingeschraenkt
    changed: "Der Test wurde auf die Steiermark ausgeweitet (Düngungs- und Bodenbearbeitungsversuche), mit unveränderten Modellen und vorab festgeschriebenem Protokoll."
    plain: >
      In der Steiermark gibt es nur Düngungs- und Bodenbearbeitungsversuche an zwei Standorten, und davon nur 12 Jahre mit brauchbarem Vergleichswert.
      Das ist weniger als die 15, die wir für einen echten Test vorab verlangt haben. Der Stress-Score zeigt dieselbe Richtung wie in Oberösterreich,
      aber die Unsicherheit ist so groß, dass man nichts behaupten kann. Das EU-Regionalmodell zeigt für die Steiermark kein Signal.
    metrics:
      - label: "Stress-Score gegen Standorterträge (Steiermark), 1.9. (ρ)"
        value: "0,47"
        ci: "[-0,32; 0,95]"
        n: "12 Standort-Jahre, 7 Jahre"
        plain: "Nicht auswertbar (unter 15 Standort-Jahren); nur beschreibend."
      - label: "Regionalmodell (Steiermark) gegen Standorterträge (ρ)"
        value: "-0,13"
        ci: "[-0,59; 0,56]"
        n: "10 Standort-Jahre, 6 Jahre"
        plain: "Kein Signal."
      - label: "Vergleich: einfaches NDVI (ρ)"
        value: "0,39"
        ci: "[-0,16; 0,88]"
        n: "12 Standort-Jahre"
        plain: "Ähnlich wie der Score."
    found:
      - "Hatzendorf hat kein auswertbares Vergleichsjahr-Mittel (nur 3 Versuchsjahre); ausgewertet wurden Wagna (7) und Kalsdorf (5)."
      - "Bei Wagna fällt das Ertragsmittel ab 2021 von etwa 10 auf 6–7 t/ha; das kann auch am Versuchsdesign liegen."
    limits:
      - "Zwei Standorte, 12 Standort-Jahre: Aussage nur beschreibend."
      - "Düngungs-/Bodenbearbeitungsversuche sind keine reinen Wettereffekt-Messungen; Gemeindemitte statt Parzelle; keine Feld-Ertragsdaten."
      - "Der Verbund Oberösterreich + Steiermark (ρ 0,43, n = 46) ist nicht unabhängig, weil Oberösterreich im ersten Test schon ausgewertet wurde."
    links:
      - label: "Ergebnis"
        path: reports/at_test_stmk_ergebnis.md
      - label: "Datenkritik"
        path: reports/data_review/at_test_stmk.md
      - label: "Freeze-Protokoll"
        path: reports/freeze_protocol_at2.md
  - id: at-test-1
    date: 2026-10-17
    phase: "Phase 7: Test in Österreich (erster, explorativ)"
    title: "Österreich-Test: Jahre werden erkannt, Standorte im selben Jahr nicht"
    status: eingeschraenkt
    changed: "Zum ersten Mal wurden die eingefrorenen Modelle (Stress-Score und EU-Regionalmodell) ohne jede Anpassung an österreichischen Daten getestet, mit vorab festgeschriebenem Protokoll; zusätzlich ein kleines Nachtrainieren."
    plain: >
      Der Stress-Score (aus US-Feldern abgeleitet) und das EU-Regionalmodell wurden vor dem Test eingefroren und dann auf österreichische Felder
      und Bundesländer angewendet. In Oberösterreich ordnet der Score gute und schlechte Jahre ordentlich ein (Rangkorrelation etwa 0,5), und das Regionalmodell
      tut dasselbe für die Bundesländer. Aber: Der Score ist nicht besser als einfaches Grün (NDVI), und er unterscheidet die Standorte im selben Jahr nicht.
      Die Steiermark konnte nicht getestet werden, weil dort keine passenden Sortenversuche vorliegen. Ein Nachtrainieren mit nur zwei Zahlen verbessert das Regionalmodell deutlich.
    metrics:
      - label: "Stress-Score vs. Versuchserträge, 1.9. (ρ, nur Oberösterreich)"
        value: "0,50"
        ci: "[0,19; 0,68]"
        n: "34 Standort-Jahre, 7 Jahre"
        plain: "Kriterium bestanden: Jahre mit mehr Stress haben meist niedrigeren relativen Ertrag."
      - label: "Vergleichswert NDVI ohne Lernen (ρ)"
        value: "0,50"
        ci: "[0,09; 0,65]"
        n: "34 Standort-Jahre"
        plain: "Gleich gut: Der Score bringt keinen Vorteil gegenüber einfachem NDVI."
      - label: "Stress-Score innerhalb eines Jahres (Median ρ über Standorte)"
        value: "-0,10"
        n: "6 Jahre mit je 4–5 Standorten"
        plain: "Welcher Standort im selben Jahr besser abschneidet, erkennt der Score nicht; die Stärke liegt in den Jahren."
      - label: "Regionalmodell vs. Statistik Austria, 1.9. (ρ)"
        value: "0,52"
        ci: "[0,13; 0,75]"
        n: "30 Region-Jahre, 6 Jahre"
        plain: "Bestanden, aber nicht stark: Der Fehler (RMSE 0,121) ist größer als bei „normales Jahr“ (0,101)."
      - label: "Nachtrainieren R1: RMSE (Leave-one-year-out)"
        value: "0,095 statt 0,125"
        ci: "Differenz [-0,047; -0,009]"
        n: "45 Region-Jahre, 9 Jahre"
        plain: "Zwei angepasste Zahlen machen das Regionalmodell erstmals knapp besser als „normales Jahr“ (0,119); nur ein Hinweis."
    found:
      - "Die Rangfolge der Jahre wird ordentlich erkannt: Jahresmittel von Score und Ertrag haben ρ 0,79; jedes einzelne Jahr weggelassen ändert das Ergebnis kaum (0,41–0,55)."
      - "Der Score hängt eng mit NDVI zusammen (ρ 0,83 auf Standort-Jahren, 0,88 auf den Feldern)."
      - "In heißen Jahren mit vielen abrupten Abfällen im Hochsommer (2018, 2024) liegt der Score niedrig, der Ertrag aber im Durchschnitt: Er könnte frühe Reife anzeigen statt Ertragsverlust."
    limits:
      - "Der lokale Test ist nur Oberösterreich (5 Standorte, Sortenversuche); die steirischen Versuche (Wagna, Kalsdorf, Hatzendorf) sind Düngungs- und Bodenbearbeitungsversuche und fielen durch den vorab festgelegten Filter."
      - "Sehr wenige Cluster (7 Jahre lokal, 6 regional): Konfidenzintervalle sind breit; ein Verfehlen hieße „nicht belegt“."
      - "Keine Feldebene (V3), keine genauen Standortkoordinaten (nur Gemeindemitte), Versuche sind keine Praxisfelder."
      - "Explorativ: Das Phase-4-Kriterium „stark genug“ war nicht erfüllt, der Test lief auf Entscheidung des Projektinhabers."
    figures:
      - file: at_test_scatter.png
        caption: "Links: Stress-Score gegen Standort-Ertrag (relativ). Rechts: Regionalmodell gegen Statistik Austria. Farbe = Jahr."
    links:
      - label: "Ergebnisbericht"
        path: reports/at_test_ergebnis.md
      - label: "Datenkritik"
        path: reports/data_review/at_test.md
      - label: "Freeze- und Testprotokoll"
        path: reports/freeze_protocol_at.md
      - label: "Vorab-Plan Nachtrainieren"
        path: reports/plan_at_nachtraining.md
  - id: if-runde2
    date: 2026-10-17
    phase: "Innerhalb-Feld über Standorte, Runde 2 (Glättung, Aufbereitung)"
    title: "Glätten bringt nichts: der Gewinn kam aus der Messung, nicht aus der Vorhersage"
    status: nicht_bestanden
    changed: "Es wurde getestet, ob eine Glättung der Satellitenvorhersage über Nachbarzellen die Karte verbessert, und ob bereinigte Mähdrescher-Rohpunkte das Bild ändern; alle Regeln standen vorher fest."
    plain: >
      Die Vermutung war, dass sich die Karte verbessert, wenn man die Vorhersage über 30 Meter glättet. Das hat sich nicht bestätigt:
      An beiden Standorten (USA und Italien) wird die Rangordnung dadurch gleich oder etwas schlechter.
      Der frühere Gewinn beim Mitteln über größere Blöcke kam daher, dass dabei auch die gemessene Ertragskarte gemittelt wurde,
      und diese verliert dabei Rauschen. Bereinigt man die Rohpunkte in Italien (Start-, Stopp- und Spurenden), steigt der Wert nur leicht.
    metrics:
      - label: "BARC: Glättung (30 m) minus keine Glättung, rohes NDVI-Fenster (Δρ)"
        value: "-0,013"
        ci: "[-0,017; 0,001]"
        n: "41 Feld-Jahre"
        plain: "Kein Gewinn; der Wert hätte mindestens +0,02 sein müssen."
      - label: "BARC: Glättung, Modell M1 (Δρ)"
        value: "+0,004"
        ci: "[-0,007; 0,012]"
        n: "41 Feld-Jahre"
        plain: "Praktisch kein Unterschied."
      - label: "Kayad: bereinigte Ertragspunkte, rohes NDVI-Fenster (ρ)"
        value: "0,623 statt 0,604"
        n: "3 Feld-Jahre"
        plain: "Kleiner Gewinn, weil die Messkarte sauberer ist; das Verfahren selbst ist nicht besser."
    found:
      - "Zufallsvorhersage bleibt nach der Glättung bei ρ ≈ 0; die Glättung erzeugt keinen Scheinzusammenhang."
      - "Die Karte bleibt im Produkt auf 10-m-Zellen; eine gröbere 30-m-Karte wäre ein anderes, leichteres Produkt."
    limits:
      - "Kayad sind nur drei Feld-Jahre eines Feldes; der Kayad-Teil des Tests ist beschreibend."
      - "Fahrspur-Unterschiede und der 18-t/ha-Deckel der Italien-Daten wurden nicht behandelt."
    links:
      - label: "Ergebnis Runde 2"
        path: reports/innerfeld_ergebnis_runde2.md
      - label: "Vorab-Festlegungen Runde 2"
        path: reports/innerfeld_vorab_runde2.md
  - id: if-obergrenze
    date: 2026-10-17
    phase: "Innerhalb-Feld über Standorte, explorative Einordnung"
    title: "Wie viel ist mit den vorhandenen Daten noch drin?"
    status: zwischenstand
    changed: "Es wurde geschätzt, wie hoch die Übereinstimmung zwischen Satellitenkarte und Ertragskarte überhaupt werden kann, weil die Ertragskarte selbst verrauscht ist."
    plain: >
      Auch eine perfekte Satellitenkarte würde die gemessene Ertragskarte nicht ganz treffen, denn der Mähdrescher misst ungenau.
      Beim italienischen Feld (Kayad) liegt diese Grenze je nach Schätzung zwischen 0,72 und 0,94; unsere Karte erreicht dort 0,60.
      Das heißt: Es gibt noch etwas Luft, aber vermutlich nur einige Hundertstel. Mittelwerte über 20 bis 30 Meter erhöhen den Wert etwas,
      sind aber auch eine einfachere Aufgabe. Für BARC lässt sich die Grenze nicht bestimmen, weil die Karten dort interpoliert sind.
    metrics:
      - label: "Kayad: Obergrenze der Ertragskarte (Korrelation)"
        value: "0,72 bis 0,94"
        n: "3 Feld-Jahre"
        plain: "Je nach Annahme über die Messfehler; die Wahrheit liegt dazwischen."
      - label: "Kayad: unsere Karte (rohes NDVI-Fenster)"
        value: "0,60"
        n: "3 Feld-Jahre"
        plain: "Etwa 84 % der vorsichtigen und 64 % der optimistischen Obergrenze."
    found:
      - "Mittelwerte über 20–30 m heben die Korrelation auf BARC von 0,70 auf 0,76 (Modell M1) und auf Kayad von 0,60 auf 0,66."
      - "Wer die Erträge der Nachbarzellen kennt, erreicht auf Kayad 0,71; der Satellit erreicht rund 85 % davon."
    limits:
      - "Nur Kayad hat Rohpunkte; BARC ist interpoliert und die Obergrenze dort nicht bestimmbar."
      - "Explorativ: keine Methodenwahl daraus; jede Verbesserung wäre eine neue, vorab festgelegte Runde."
    figures:
      - file: if_obergrenze.png
        caption: "Korrelation nach Blockgröße und geschätzte Obergrenze der Ertragskarte (Kayad)."
    links:
      - label: "Bericht Obergrenze"
        path: reports/innerfeld_obergrenze.md
  - id: if-innerfeld-ergebnis
    date: 2026-10-17
    phase: "Innerhalb-Feld über Standorte, Etappen I3–I5 (Ergebnis)"
    title: "Feldkarte: gleiche Richtung an drei Standorten, belastbar nur für BARC"
    status: eingeschraenkt
    changed: "Die Feldkarte (NDVI-Warnzonen innerhalb eines Feldes) wurde zum ersten Mal an zwei weiteren Standorten (Italien, Colorado) geprüft und mit trainierten Modellen verglichen; alle Regeln standen vorher fest."
    plain: >
      An allen drei Orten zeigt ein niedriger Grünwert im Hochsommer meist auch niedrigen Ertrag innerhalb des Feldes: in 49 von 50 Feld-Jahren.
      Belegt ist das aber nur für BARC (41 Feld-Jahre); Italien (ein Feld, drei Jahre) und Colorado (sechs Teilflächen) sind zu klein für ein Urteil.
      Ein trainiertes Modell ist auf BARC etwas besser als der rohe Grünwert (Korrelation 0,70 statt 0,67), überträgt aber nicht besser auf andere Orte.
      Das Fenster muss nicht mehr an den Kalender gebunden sein: ein Fenster um das Maximum der Kurve ist gleich gut.
    metrics:
      - label: "BARC: rohe NDVI-Regel (Median-ρ)"
        value: "0,67"
        ci: "[0,59; 0,74]"
        n: "41 Feld-Jahre"
        plain: "Je höher der Grünwert einer Zelle, desto höher meist ihr Ertrag im selben Feld."
      - label: "BARC: Modell M1 minus rohe Regel (Differenz im ρ)"
        value: "+0,04"
        ci: "[0,02; 0,06]"
        n: "41 Feld-Jahre"
        plain: "Training bringt einen kleinen, aber sicher von 0 verschiedenen Gewinn."
      - label: "Kayad (Italien) und Colorado, rohe Regel"
        value: "0,60 und 0,63"
        n: "3 und 6 Feld-Jahre"
        plain: "Gleiche Richtung wie bei BARC; zu wenige Feld-Jahre für ein Urteil."
    found:
      - "Spitzenfenster und Kalenderfenster sind auf BARC gleich gut (Unterschied -0,002); damit sind andere Klimaräume ohne neues Fenster abgedeckt."
      - "Ein auf Kayad oder Colorado trainiertes Modell ist auf BARC schlechter als der rohe Grünwert (0,58 statt 0,67)."
      - "Geländemerkmale und reine Position erklären praktisch nichts."
    limits:
      - "Gate 'überträgt auf Fremdstandort' ist nach der vorab festgelegten Regel nicht prüfbar, weil kein Fremdstandort mindestens 10 Feld-Jahre hat."
      - "Der Label-Shuffle-Test ist nach Vorab-Wortlaut nur unter einer von zwei Lesarten bestanden; beide sind offengelegt."
      - "Kayad hatte variable Düngung und Fahrstreifen, BARC-Zonen können Boden sein; ein Alarm heißt 'auffällige Kurve', nicht 'Stress'."
    figures:
      - file: if_perfy_rho.png
        caption: "Je Feld-Jahr: Rangzusammenhang zwischen Satellitenmerkmal und relativem Ertrag, drei Standorte."
      - file: if_transfer_matrix.png
        caption: "Training auf einem Standort, Test auf einem anderen (Median-ρ, nur BARC belastbar)."
      - file: if_kayad_maps.png
        caption: "Kayad: gemessene Ertragskarte und NDVI-Warnzonen für drei Jahre."
    links:
      - label: "Ergebnisbericht"
        path: reports/innerfeld_ergebnis.md
      - label: "Vorab-Festlegungen"
        path: reports/innerfeld_vorab.md
      - label: "Datenkritik I4"
        path: reports/data_review/if_i4_ergebnis.md
  - id: if-i2-merkmale
    date: 2026-10-17
    phase: "Innerhalb-Feld über Standorte, Etappe I2 (Satellitenmerkmale)"
    title: "Satellitenkurven für alle Standorte gleich aufgebaut"
    status: eingeschraenkt
    changed: "Für BARC, Kayad und Colorado wurden Satellitenkurven (Sentinel-2, 10-Tage-Abschnitte) je Messpunkt abgerufen und zu vergleichbaren Merkmalen verarbeitet; Ertragswerte wurden dabei nicht verwendet."
    plain: >
      Damit die Feldkarte an mehreren Orten gleich geprüft werden kann, haben alle Standorte jetzt dieselben Satellitenmerkmale.
      Statt eines festen Kalenderfensters wird das Fenster um das Maximum der Grünkurve gelegt; das passt auch für andere Klimaräume.
      Ein Fehler beim Abruf (verlorenes Datum) fiel vor jeder Auswertung auf und wurde behoben. Der Vergleich mit dem
      mitgelieferten Satellitenbild von Kayad zeigt, dass die Messpunkte räumlich richtig getroffen werden.
    metrics:
      - label: "Räumliche Ausrichtung (Kayad, Spearman-ρ)"
        value: "0,91–0,97"
        n: "3 Jahre, 829–1532 Zellen"
        plain: "Unser Grünwert stimmt mit dem Satellitenbild der Datenautoren Zelle für Zelle überein; es gibt keinen Versatz."
      - label: "Feld-Jahre mit Merkmalen"
        value: "54 von 54"
        plain: "Alle Standorte (BARC 41, Colorado 10, Kayad 3) haben ein gültiges Grünmaximum und genügend Zellen."
    found:
      - "Im Hochsommer gibt es nur 1–3 klare Satellitenaufnahmen je 10 Tage; deshalb werden je drei Abschnitte zusammengefasst."
      - "In Kayad liegt der Grünwert nahe der Sättigung (0,9–0,95); Unterschiede zwischen Zellen sind klein."
    limits:
      - "Kayad 2016 hat nur 9 gültige Abschnitte, weil in Europa damals kaum aufbereitete Satellitendaten vorlagen."
      - "Kayad und Colorado sind praktisch eben; die Gelände-Kontrolle ist dort nicht aussagekräftig."
    links:
      - label: "Datenkritik I2"
        path: reports/data_review/if_i2_merkmale.md
      - label: "Plan Innerhalb-Feld"
        path: reports/plan_innerfeld.md
  - id: if-i1-daten
