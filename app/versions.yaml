  - id: abgabe-hauptergebnis
    date: 2026-10-16
    phase: "Entscheidung des Projektinhabers (Abgabe)"
    title: "Hauptergebnis: die Karte innerhalb des Feldes und das EU-Regionalmodell"
    status: abgeschlossen
    changed: "Der Projektinhaber hat festgelegt, dass die Abgabe die belastbarsten Ergebnisse in den Vordergrund stellt: wo im Feld Ertrag fehlt, und welche Jahre in EU-Regionen schlechter werden."
    plain: >
      Nach der Feinjustierung ist klar, welche Aussagen halten: Innerhalb eines Feldes zeigt der Grünwert im Hochsommer
      zuverlässig, wo Ertrag fehlt. Auf Regionalebene erkennt das EU-Modell schwach, aber gesichert, welche Jahre schlechter werden.
      Die Rangliste ganzer Felder bleibt Teil des Projekts, aber mit der Grenze, dass ein auffälliges Feld auch spät gesät sein kann.
      Es wurde dafür nichts neu gerechnet.
    metrics:
      - label: "Innerhalb des Feldes (Median-ρ)"
        value: "0,68"
        ci: "[0,54; 0,72]"
        n: "41 Feld-Jahre"
        plain: "Je höher der Grünwert eines Pixels, desto höher meist sein Ertrag; 1 wäre eine perfekte Rangfolge."
