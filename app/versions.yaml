  - id: v0.3.0
    date: 2026-10-16
    phase: "Phase 2"
    title: "Basismodelle: Was bestimmt den Ertrag?"
    status: eingeschraenkt
    changed: "Erste Modelle trainiert – Satellit, Wetter, Boden einzeln und kombiniert; dazu das Modell innerhalb des Feldes."
    plain: >
      Jetzt lernen Modelle aus den aufbereiteten Daten. Jede Merkmalsgruppe (Satellit, Wetter, Boden/Gelände)
      bekommt ein eigenes Modell, dazu Kombinationen. Geprüft wird immer streng: Das Feld UND das Jahr, das
      bewertet wird, hat das Modell nie gesehen. Ergebnis: Unterschiede zwischen Jahren lernt das Modell nicht.
      Unterschiede innerhalb eines Feldes (wo im Feld fehlt Ertrag?) erkennt der Satellit dagegen gut.
    metrics:
      - label: "Gewähltes Modell, ungesehenes Feld + Jahr"
        value: "ρ = −0,04"
        ci: "[−0,29; 0,37]"
        n: "89 Feld-Jahre / 8 Standort-Jahre"
        plain: "Praktisch Zufall. Das Modell kann nicht sagen, ob ein unbekanntes Jahr gut oder schlecht wird."
      - label: "Dasselbe Modell, Jahr schon gesehen"
        value: "ρ = 0,65"
        plain: "Sobald das Modell das Jahr kennt, wird es gut – es lernt also „welches Jahr“ statt „wie geht es dem Feld“."
      - label: "Innerhalb des Feldes: Satellit ↔ Ertragskarte"
        value: "ρ = 0,68"
        ci: "[0,54; 0,72]"
        n: "41 Feld-Jahre (BARC)"
        plain: "Wo im Feld der Mais im Juli/August weniger grün ist, wird im Herbst weniger geerntet. Das ist das stärkste Ergebnis."
    found:
      - "Michigan und Maryland sind in den Merkmalen zu 100 % unterscheidbar – das Modell erkennt den Standort sofort."
      - "Problemzonen im Feld kehren von Jahr zu Jahr wieder (ρ 0,67) – das deutet auf Boden oder Gelände."
      - "Label-Shuffle-Test: Werden die Erträge zufällig vertauscht, fällt jedes Modell auf Zufall. Kein Ergebnis war verdächtig gut."
    limits:
      - "Mit 8 Standort-Jahren sind alle Vertrauensbereiche sehr breit."
    figures:
      - file: phase2_earlywarning_main.png
        caption: "Frühwarnkurve: Güte des Hauptmodells je Stichtag."
      - file: phase2_shap_main.png
        caption: "Welche Merkmale das Modell nutzt (SHAP)."
      - file: phase2_within_field_maps.png
        caption: "Ein BARC-Feld 2020: gemessener Ertrag (links), Satelliten-NDVI (Mitte), Zusammenhang (rechts)."
      - file: phase2_within_field_rho.png
        caption: "Innerhalb der Felder: Zusammenhang Satellit ↔ Ertrag je Feld-Jahr."
    links:
