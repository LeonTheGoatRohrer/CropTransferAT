        n: "KBS 294 · BARC 61 · Colorado 10"
        plain: "So viele Kombinationen aus Feld und Jahr mit gemessenem Ertrag gibt es."
      - label: "Davon mit relativem Ertrag und Satellit"
        value: "123"
