      Jetzt ging es um die eigentliche Frage: Kann man früh in der Saison erkennen, welche Felder gefährdet sind
      (mindestens 15 % unter ihrem Normalniveau)? Am besten funktioniert die einfachste Methode: Man vergleicht die
      Satellitenkurve des Feldes mit der Kurve eines „gesunden Maisfeldes“ und misst den Abstand. Für den vorab
      festgelegten Test „stark genug“ reicht das aber nicht. Nach den eigenen Regeln wird das Modell deshalb nicht
      eingefroren und nicht in Österreich getestet.
