    phase: "Phase 1"
    title: "Ertragsdaten aufbereitet"
    status: eingeschraenkt
    changed: "Alle Ertragsdaten in ein Format gebracht und mit Satellitenkurven, Wetter und Boden verbunden."
    plain: >
      Jedes Feld und jedes Jahr mit gemessenem Ertrag wurde in eine Tabelle gebracht: Wie viel wurde geerntet,
      wie sah die Satellitenkurve über die Saison aus, wie war das Wetter, welcher Boden? Dabei wurde geprüft, ob
      die Kurven wirklich wie Mais aussehen und ob alte Satelliten (Landsat 5/7) mit den neuen vergleichbar sind.
    metrics:
